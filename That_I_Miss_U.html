<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>imissyou</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}

.lyrics-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
    z-index: 5;
}

.lyric-line {
    display: none;
    font-size: 1.5rem;
    color: white;
    margin: 20px 0;

    opacity: 0;
    transform: translateY(10px);

    transition:
        opacity 0.5s ease,
        transform 0.5s ease;

    text-shadow:
        2px 2px 12px rgba(255,255,255,0.4);
}

.lyric-line.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
}

#next-btn {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);

    width: 60px;
    height: 60px;

    border-radius: 50%;
    border: 1px solid white;

    background: rgba(255,255,255,0.1);
    color: white;

    font-size: 28px;
    cursor: pointer;

    z-index: 10;
}

#next-btn:disabled {
    opacity: 0.5;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>


<!-- =========================
     MUSIC
========================= -->

<audio id="music">
    <source src="thatimissu.mp3" type="audio/mpeg">
</audio>


<!-- =========================
     LYRICS
========================= -->

<div class="lyrics-container">

    <div class="lyric-line">That I miss you</div>

    <div class="lyric-line">You know it's true</div>

    <div class="lyric-line">So what if I call</div>

    <div class="lyric-line">
        And you pick up the phone?
    </div>

    <div class="lyric-line">
        And I use this holiday
    </div>

    <div class="lyric-line">
        To make my way to your ghost
    </div>

</div>


<!-- =========================
     BUTTON
========================= -->

<button id="next-btn">→</button>


<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   FIREWORKS
========================= */

let rocket = null;
let particles = [];


class Rocket {

    constructor(x, y) {

        this.x = x;
        this.y = canvas.height;
        this.targetY = y;

        this.speed = 7;
        this.exploded = false;
    }

    update() {

        this.y -= this.speed;

        if (this.y <= this.targetY) {
            this.explode();
        }
    }

    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "white";
        ctx.fill();
    }

    explode() {

        this.exploded = true;

        for (let i = 0; i < 60; i++) {

            particles.push(
                new Particle(
                    this.x,
                    this.y
                )
            );

        }
    }
}


class Particle {

    constructor(x, y) {

        this.x = x;
        this.y = y;

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            Math.random() * 5 + 2;

        this.vx =
            Math.cos(angle) * speed;

        this.vy =
            Math.sin(angle) * speed;

        this.life = 100;
    }

    update() {

        this.x += this.vx;
        this.y += this.vy;

        this.vy += 0.04;

        this.life--;
    }

    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${this.life / 100})`;

        ctx.fill();
    }
}


function launch(x, y) {

    if (rocket && !rocket.exploded) return;

    rocket = new Rocket(

        x || Math.random() * canvas.width,

        y ||
        canvas.height * 0.2 +
        Math.random() *
        canvas.height * 0.3

    );
}


/* =========================
   ANIMATION
========================= */

function animate() {

    ctx.fillStyle =
        "rgba(13, 13, 13, 0.12)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (rocket && !rocket.exploded) {

        rocket.update();
        rocket.draw();

    }


    particles.forEach(
        (particle, index) => {

            particle.update();
            particle.draw();

            if (particle.life <= 0) {
                particles.splice(index, 1);
            }

        }
    );


    requestAnimationFrame(animate);
}

animate();


/* =========================
   MUSIC + LYRIC TIMING
========================= */

const lines =
    document.querySelectorAll(".lyric-line");

const nextBtn =
    document.getElementById("next-btn");

const music =
    document.getElementById("music");


/*
   CHANGE THESE NUMBERS
   TO MATCH YOUR SONG.

   Numbers = seconds into the song.
*/

const timings = [

    0,       // That I miss you

    5,     // You know it's true

    9,     // So what if I call

    13,     // And you pick up the phone?

    18,    // And I use this holiday

    20     // To make my way to your ghost

];


let started = false;


nextBtn.addEventListener("click", () => {

    if (started) return;

    started = true;

    /* Start music */
    music.play();

    /* Disable button */
    nextBtn.disabled = true;

    /* Firework */
    launch();


    /*
       Check the song's
       current time continuously.
    */

    function updateLyrics() {

        const currentTime =
            music.currentTime;


        /* Hide all lyrics */

        lines.forEach(line => {

            line.classList.remove("active");

        });


        /* Find the correct lyric */

        let currentLine = -1;


        for (
            let i = 0;
            i < timings.length;
            i++
        ) {

            if (
                currentTime >= timings[i]
            ) {

                currentLine = i;

            }

        }


        /* Show correct lyric */

        if (
            currentLine >= 0 &&
            currentLine < lines.length
        ) {

            lines[currentLine]
                .classList.add("active");

        }

    }


    music.addEventListener(
        "timeupdate",
        updateLyrics
    );


    updateLyrics();

});


/* =========================
   AUTOMATIC FIREWORKS
========================= */

setInterval(() => {

    launch();

}, 3000);


/* =========================
   CLICK SCREEN = FIREWORK
========================= */

document.addEventListener(
    "click",
    (event) => {

        if (event.target === nextBtn)
            return;

        launch(
            event.clientX,
            event.clientY
        );

    }
);

</script>

</body>
</html>
